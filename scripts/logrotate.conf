# Rotation for logs/, run from the user's own crontab.
#
# Deliberately NOT an /etc/logrotate.d entry. That would need root to install,
# and root to edit afterwards; everything else this deployment does runs as the
# unprivileged user out of the repo, and a rule living somewhere the repo does
# not know about is a rule that goes stale when the checkout moves. Driven by
# `scripts/cron-guard logrotate ...` instead, so a broken rotation alerts like
# any other failed job.
#
# **The quotes around the path are load-bearing.** logrotate parses a bare
# relative path as a keyword — `logs/*.log { ... }` fails with
# `keyword 'logs' not properly separated, found 0x2f`. Quoted, it globs against
# the working directory, which the cron line's `cd` fixes.
"logs/*.log" {
    # Generous, because these are not ordinary service logs. logs/observe.log is
    # the only record of WHEN Sleeper rewrites the completed season — the 48-hour
    # alternation and the sweep dates in implementation-plan.md §12 were read out
    # of it, and none of it can be reconstructed after the fact. Two years of
    # monthly archives of a file that grows ~70 KB a month, compressed, costs
    # nothing worth counting.
    monthly
    rotate 24
    compress

    # Rotate early if something floods. Four days of tracebacks put 38 KB into
    # logs/ingest.log in September; a tighter loop could do far worse, and the
    # point of rotating at all is that nothing else truncates these.
    maxsize 5M

    # `observe.log-20260920.gz` rather than `observe.log.1.gz`. These are
    # evidence: a reader should be able to tell which window a file covers
    # without unpacking it, and a renumbering scheme makes every archived name
    # mean something different after the next rotation.
    dateext

    # A fresh deployment has no logs/advice.log until the job first runs.
    missingok
    notifempty

    # 0600, matching cron-guard's umask. logs/digest.log carries the lineup and
    # the others can carry a traceback with paths in them. No owner or group, so
    # the file stays with whoever runs the rotation — which is the point of
    # keeping this out of /etc.
    create 0600
}
